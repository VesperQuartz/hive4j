app = "hive4j"
primary_region = "fra"

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
PORT = "3000"
HOST = "0.0.0.0"
HIVE_RUN_STORE = "/data/hive.rl"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[mounts]]
source = "hive_data"
destination = "/data"

[[vm]]
memory = "1gb"
cpu_kind = "shared"
cpus = 1
